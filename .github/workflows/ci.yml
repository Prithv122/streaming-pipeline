name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # No extras: the broker client must not be needed for the core or its tests.
      - name: Install dependencies
        run: uv sync --all-groups

      - name: Broker client absent from the fast job
        run: uv run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('confluent_kafka') is not None)"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -m "not integration" --cov=src --cov-report=term-missing

      - name: Sweep smoke
        run: uv run streampipe sweep --small --out results/scratch/sweep_small.csv
