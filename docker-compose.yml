# Single-node Redpanda for the local end-to-end run. Kafka API on 127.0.0.1:19092.
#
#   docker compose up -d                      broker + one-shot topic creation
#   docker compose --profile console up -d    also the web console on http://localhost:18080
#   docker compose down -v                    stop and wipe the broker's data
#
# Image tags are pinned (see docs/kafka.md for the dates). Ports bind to loopback only.

name: streampipe

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One partition on purpose: the window clock is the max event_time seen, so the consumer needs
  # one total order across zones (docs/kafka.md). Re-running is safe: existing topics are kept.
  # Auto-creation is switched off first, so a mistyped topic name fails instead of creating a topic.
  init-topics:
    image: redpandadata/redpanda:v26.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk cluster config set auto_create_topics_enabled false -X admin.hosts=redpanda:9644
        && (rpk topic create orders.v1 windows.v1 -p 1 -r 1 -X brokers=redpanda:9092
        || rpk topic list -X brokers=redpanda:9092)

  console:
    profiles: ["console"]
    image: redpandadata/console:v3.12.0
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  redpanda-data:
